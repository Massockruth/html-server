<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live YOLO Streams</title>

    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #111; color: white; }
        h1 { text-align: center; padding: 15px; margin: 0; background: #222; }

        .layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            height: calc(100vh - 70px);
            gap: 15px;
            padding: 15px;
        }

        /* Main View Section */
        .main-container {
            display: flex;
            flex-direction: column;
            background: #000;
            border: 2px solid #444;
            border-radius: 10px;
        }

        #mainStream {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #mainStream img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* The Control Bar */
        .controls-bar {
            background: #222;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-top: 2px solid #444;
        }

        .status-box {
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            background: #333;
            min-width: 150px;
            text-align: center;
        }

        .status-recording { color: #ff4d4d; border: 1px solid #ff4d4d; }
        .status-idle { color: #888; border: 1px solid #444; }

        /* Sidebar Thumbnails */
        .thumbnails {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .thumbnail {
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 5px;
            background: #222;
        }

        .thumbnail:hover { border-color: #007bff; }
        .thumbnail.active { border-color: #28a745; }
        .thumbnail img { width: 100%; border-radius: 4px; }
        .thumbnail h4 { margin: 5px 0; text-align: center; font-size: 0.8rem; color: #ccc; }

        button {
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            border: none;
        }

        .btn-rec { background: #e74c3c; color: white; }
        .btn-dl { background: #3498db; color: white; }
    </style>
</head>
<body>

<h1>Live YOLO Streams</h1>

<div class="layout">
    <div class="main-container">
        <div id="mainStream">
            <p id="placeholder">Select a Pi from the list</p>
        </div>

        <div class="controls-bar">
            <button class="btn-rec" onclick="toggleRecord()">Start/Stop Recording</button>
            <button class="btn-dl" onclick="downloadVideo()">Download Video</button>
            <div id="statusBox" class="status-box status-idle">Not recording</div>
        </div>
    </div>

    <div class="thumbnails" id="thumbnailContainer"></div>
</div>

<script>
    let currentIP = "";

    function loadStreams() {
        const params = new URLSearchParams(window.location.search);
        const container = document.getElementById("thumbnailContainer");
        
        let index = 1;
        for (const [key, ip] of params.entries()) {
            const streamUrl = `http://${ip}:5000/video_feed`;
            
            const div = document.createElement("div");
            div.className = "thumbnail";
            div.id = `pi-${ip.replace(/\./g, '-')}`;
            div.innerHTML = `<h4>Pi ${index} (${ip})</h4><img src="${streamUrl}">`;
            
            div.onclick = () => switchMainStream(ip, streamUrl);
            container.appendChild(div);

            if (index === 1) switchMainStream(ip, streamUrl);
            index++;
        }
    }

    function switchMainStream(ip, url) {
        currentIP = ip;
        document.getElementById("mainStream").innerHTML = `<img src="${url}">`;
        
        // Reset status visuals when switching
        const statusBox = document.getElementById("statusBox");
        statusBox.innerText = "Checking status...";
        statusBox.className = "status-box status-idle";

        // Optional: Call Pi to see if it is already recording
        checkActualStatus(ip);

        // UI Highlighting
        document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
        document.getElementById(`pi-${ip.replace(/\./g, '-')}`).classList.add('active');
    }

    function toggleRecord() {
        if (!currentIP) return;
        
        const statusBox = document.getElementById("statusBox");

        fetch(`http://${currentIP}:5000/toggle_record`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'started') {
                    statusBox.innerText = "● RECORDING";
                    statusBox.className = "status-box status-recording";
                } else {
                    statusBox.innerText = "Not recording";
                    statusBox.className = "status-box status-idle";
                }
            })

    }





















    

    function downloadVideo() {
        if (!currentIP) return;
        window.location.href = `http://${currentIP}:5000/download`;
    }

    // This helps sync the UI if the Pi is already recording
    function checkActualStatus(ip) {
        // This assumes you have a /status endpoint on your Flask app
        fetch(`http://${ip}:5000/status`)
            .then(res => res.json())
            .then(data => {
                const statusBox = document.getElementById("statusBox");
                if (data.recording) {
                    statusBox.innerText = "● RECORDING";
                    statusBox.className = "status-box status-recording";
                } else {
                    statusBox.innerText = "Not recording";
                    statusBox.className = "status-box status-idle";
                }
            }).catch(() => {
                document.getElementById("statusBox").innerText = "Ready";
            });
    }

    loadStreams();
</script>

</body>
</html>
